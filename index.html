<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>输气工刷题系统</title>
    <meta name="theme-color" content="#2f6fed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260802-v4" />
    <script src="./vendor/vue.global.prod.js"></script>
    <script src="./vendor/mammoth.browser.min.js"></script>
    <script>
      (function () {
        var tab = new URLSearchParams(window.location.search).get("tab");
        if (tab) window.INITIAL_TAB = tab;
      })();
    </script>
    <script src="./app-config.js?v=20260802-ai"></script>
  </head>
  <body>
    <template id="app-template">
      <div class="app-shell">
        <header class="hero">
          <div>
            <p class="eyebrow">输气工刷题系统</p>
            <h1>今日练习</h1>
            <p class="muted">个人记录、收藏和错题会跟随当前登录档案保存。</p>
          </div>
          <div class="hero-stats">
            <span>总题 {{ stats.totalQuestions }}</span>
            <span>已做 {{ stats.doneQuestions }}</span>
            <span>正确率 {{ stats.correctRate }}%</span>
            <span>收藏 {{ stats.favorites }}</span>
          </div>
          <button class="profile-chip" @click="tab = 'profile'">
            <span>{{ profileName || '未登录' }}</span>
            <strong>{{ profileName ? '个人中心' : '登录' }}</strong>
          </button>
        </header>

        <section v-if="!ready" class="panel notice">
          <strong>还没连上 Supabase。</strong>
          <p>先填写 `app-config.js` 里的 `supabaseUrl` 和 `supabaseAnonKey`。</p>
        </section>

        <section class="tabs desktop-tabs">
          <button :class="{ active: tab === 'home' }" @click="tab = 'home'">首页</button>
          <button :class="{ active: tab === 'practice' }" @click="tab = 'practice'">刷题</button>
          <button :class="{ active: tab === 'exam' }" @click="tab = 'exam'">模拟考试</button>
          <button :class="{ active: tab === 'wrong' }" @click="tab = 'wrong'">错题集</button>
          <button :class="{ active: tab === 'profile' }" @click="tab = 'profile'">个人</button>
          <button :class="{ active: ['learning', 'upload', 'admin', 'docs', 'roster', 'review', 'manage'].includes(tab) }" @click="tab = 'manage'">管理</button>
        </section>

        <section v-if="message" class="panel success">{{ message }}</section>
        <section v-if="error" class="panel error">{{ error }}</section>
        <section v-if="versionNotice" class="panel notice version-notice">
          <strong>题库已更新</strong>
          <p>题库内容有更新，点击同步获取最新题目。</p>
          <button @click="syncBankVersion">立即同步</button>
        </section>

        <section v-show="tab === 'home'" class="panel stack">
          <div class="section-head">
            <h2>五等级学习驾驶舱</h2>
            <button class="ghost" @click="refreshAll">刷新</button>
          </div>
          <div class="level-grid">
            <article v-for="item in levelDashboard" :key="item.value" class="level-card" @click="enterLevel(item.value)">
              <div class="level-card-head">
                <strong>{{ item.label }}</strong>
                <span>{{ item.progress }}%</span>
              </div>
              <div class="level-stat-row">
                <span>题目数量</span>
                <b>{{ item.total === null ? '读取中' : item.total }}</b>
              </div>
              <div class="level-stat-row">
                <span>完成数量</span>
                <b>{{ item.done }}</b>
              </div>
              <div class="level-stat-row">
                <span>正确率</span>
                <b>{{ item.correctRate }}%</b>
              </div>
              <div class="progress">
                <span :style="{ width: item.progress + '%' }"></span>
              </div>
            </article>
          </div>
          <div class="home-grid">
            <article class="home-card">
              <span>今日练习</span>
              <strong>{{ todayTask.done }}/{{ todayTask.target }}</strong>
              <p class="muted">还差 {{ todayTask.remaining }} 题</p>
              <button @click="tab = 'practice'">开始练习</button>
            </article>
            <article class="home-card">
              <span>最近考试</span>
              <div v-if="recentExams.length" class="recent-exam-list">
                <div v-for="item in recentExams" :key="item.id" class="recent-exam-row">
                  <strong>{{ item.dateText }}</strong>
                  <p class="muted">分数 {{ item.score }} · 正确率 {{ item.total ? Math.round((item.correct / item.total) * 100) : 0 }}% · 用时 {{ item.timeText }}</p>
                </div>
              </div>
              <p v-else class="muted">还没有考试记录。</p>
            </article>
          </div>
        </section>

        <section v-show="tab === 'profile'" class="panel grid-two profile-panel">
          <div class="stack">
            <div class="section-head">
              <h2>个人登录</h2>
              <button class="ghost" @click="fillCurrentProfile">使用当前档案</button>
            </div>
            <div class="actions mode-switch">
              <button class="ghost" :class="{ active: authMode === 'email' }" @click="authMode = 'email'">邮箱登录</button>
              <button class="ghost" :class="{ active: authMode === 'phone' }" @click="authMode = 'phone'">手机号登录</button>
            </div>
            <div v-if="authMode === 'email'" class="form-grid profile-grid">
              <label>
                姓名
                <input v-model.trim="profileForm.name" type="text" autocomplete="name" placeholder="注册后显示的名字" />
              </label>
              <label>
                邮箱
                <input v-model.trim="profileForm.email" type="email" autocomplete="username" placeholder="name@example.com" />
              </label>
              <label>
                密码
                <input v-model.trim="profileForm.password" type="password" autocomplete="current-password" placeholder="至少 6 位字符" />
              </label>
            </div>
            <div v-if="authMode === 'email'" class="actions">
              <button @click="loginProfile">{{ profileForm.mode === 'sign_up' ? '注册账号' : '登录' }}</button>
              <button class="ghost" @click="profileForm.mode = profileForm.mode === 'sign_up' ? 'sign_in' : 'sign_up'">
                {{ profileForm.mode === 'sign_up' ? '已有账号，去登录' : '没有账号，去注册' }}
              </button>
              <button class="ghost" @click="logoutProfile">退出登录</button>
              <button v-if="userId" class="ghost" @click="saveProfileName">保存姓名</button>
            </div>
            <div v-if="authMode === 'phone'" class="form-grid profile-grid">
              <label>
                姓名
                <input v-model.trim="profileForm.name" type="text" autocomplete="name" placeholder="注册时填写，之后可改" />
              </label>
              <label>
                手机号
                <input v-model.trim="profileForm.phone" type="tel" maxlength="11" placeholder="11 位手机号" />
              </label>
              <label>
                密码
                <input v-model.trim="profileForm.password" type="password" autocomplete="current-password" placeholder="至少 6 位字符" />
              </label>
            </div>
            <div v-if="authMode === 'phone'" class="actions">
              <button @click="profileForm.mode === 'sign_up' ? phoneSignUp() : phoneSignIn()">
                {{ profileForm.mode === 'sign_up' ? '手机号注册' : '手机号登录' }}
              </button>
              <button class="ghost" @click="profileForm.mode = profileForm.mode === 'sign_up' ? 'sign_in' : 'sign_up'">
                {{ profileForm.mode === 'sign_up' ? '已有账号，去登录' : '没有账号，去注册' }}
              </button>
              <button class="ghost" @click="logoutProfile">退出登录</button>
              <button v-if="userId" class="ghost" @click="saveProfileName">保存姓名</button>
            </div>
            <div class="profile-summary">
              <article>
                <span>当前名称</span>
                <strong>{{ profileName || '未登录' }}</strong>
              </article>
              <article>
                <span>档案身份</span>
                <strong>{{ userId ? (userRole || '--') : '--' }}</strong>
              </article>
              <article>
                <span>学习记录</span>
                <strong>{{ stats.doneQuestions }} 题</strong>
              </article>
            </div>
          </div>
          <div class="stack">
            <h2>个人学习</h2>
            <div class="home-grid compact">
              <article class="home-card">
                <span>今日练习</span>
                <strong>{{ todayTask.done }}/{{ todayTask.target }}</strong>
                <p class="muted">还差 {{ todayTask.remaining }} 题</p>
              </article>
              <article class="home-card">
                <span>连续学习</span>
                <strong>{{ learningStats.streakDays }} 天</strong>
                <p class="muted">总体正确率 {{ learningStats.correctRate }}%</p>
              </article>
            </div>
            <div v-if="recentExams.length" class="recent-exam-list">
              <div v-for="item in recentExams" :key="item.id" class="recent-exam-row">
                <strong>{{ item.dateText }}</strong>
                <p class="muted">分数 {{ item.score }} · 正确率 {{ item.total ? Math.round((item.correct / item.total) * 100) : 0 }}%</p>
              </div>
            </div>
            <p v-else class="empty">还没有个人考试记录。</p>
          </div>
        </section>

        <section v-show="tab === 'manage'" class="panel stack">
          <div class="section-head">
            <h2>管理</h2>
            <button class="ghost" @click="refreshAll">刷新数据</button>
          </div>
          <div class="manage-grid">
            <article class="home-card">
              <span>上传题库</span>
              <strong>Word / CSV</strong>
              <p class="muted">批量导入、查看导入记录。</p>
              <button @click="tab = 'upload'">进入上传</button>
            </article>
            <article class="home-card">
              <span>后台管理</span>
              <strong>题目 / 章节</strong>
              <p class="muted">新增、编辑、删除题目和章节。</p>
              <button @click="tab = 'admin'">进入后台</button>
            </article>
            <article class="home-card">
              <span>学习看板</span>
              <strong>成员统计</strong>
              <p class="muted">每人做题量、正确率、考试成绩，可导出 Excel。</p>
              <button @click="tab = 'roster'">查看看板</button>
            </article>
            <article class="home-card">
              <span>纠错审核</span>
              <strong>题目反馈</strong>
              <p class="muted">学员反馈的错题、错答案，审核后修正。</p>
              <button @click="tab = 'review'">进入审核</button>
            </article>
            <article class="home-card">
              <span>学习中心</span>
              <strong>统计</strong>
              <p class="muted">查看章节掌握和学习数据。</p>
              <button @click="tab = 'learning'">查看统计</button>
            </article>
            <article class="home-card">
              <span>部署教程</span>
              <strong>配置</strong>
              <p class="muted">Supabase、Netlify 和配置说明。</p>
              <button @click="tab = 'docs'">查看教程</button>
            </article>
          </div>
        </section>

        <section v-show="tab === 'upload'" class="panel grid-two">
          <div class="stack">
            <h2>一次性灌题库</h2>
            <p class="muted">选择整个题库文件夹或补选多个文件，系统会自动识别初级 / 中级 / 高级 / 技师 / 理论 / 实操，并批量写入 Supabase 后台题库表。</p>
            <div class="form-grid">
              <label>
                默认等级
                <select v-model="uploadForm.level">
                  <option v-for="item in levels" :key="item.value" :value="item.value">{{ item.label }}</option>
                </select>
              </label>
              <label>
                默认分类
                <input v-model="uploadForm.category" />
              </label>
              <label class="checkbox">
                <input type="checkbox" v-model="uploadForm.autoDetectMeta" />
                自动识别等级/理论实操
              </label>
            </div>
            <div class="import-pickers">
              <label class="picker-card primary">
                <span class="picker-title">选文件夹直灌后台</span>
                <span class="muted">整包解析 `.docx` / `.txt`，批量写入题库表；`.doc` 会记录但静态前端不解析。</span>
                <span class="picker-button">选择题库文件夹</span>
                <input class="hidden-file" type="file" accept=".doc,.docx,.txt" webkitdirectory directory multiple @change="onPickUploadFolder" />
              </label>
              <label class="picker-card">
                <span class="picker-title">补选单个或多个文件</span>
                <span class="muted">适合临时追加几份题库材料。</span>
                <span class="picker-button secondary">选择文件</span>
                <input class="hidden-file" type="file" accept=".doc,.docx,.txt" multiple @change="onPickUploadFile" />
              </label>
            </div>
            <p class="upload-summary">{{ selectedUploadSummary }}</p>
            <div v-if="uploadStatus.state !== 'idle'" class="upload-progress" :class="{ busy: uploadStatus.state === 'running' }">
              <strong>{{ uploadStatus.title }}</strong>
              <p>{{ uploadStatus.detail }}</p>
            </div>
            <button @click="uploadAndParse" :disabled="uploadStatus.state === 'running'">
              {{ uploadButtonText }}
            </button>
          </div>
          <div class="stack">
            <h2>上传记录</h2>
            <div v-if="sourceFiles.length" class="list">
              <article v-for="item in sourceFiles" :key="item.id" class="list-item">
                <div>
                  <strong>{{ item.original_name }}</strong>
                  <p class="muted">{{ labelOfLevel(item.level) }} · {{ item.category }}</p>
                  <p class="muted">导入 {{ item.imported_count }}，重复 {{ item.duplicate_count }}，未识别 {{ item.unrecognized_count }}</p>
                </div>
                <div class="actions">
                  <a v-if="item.public_url" :href="item.public_url" target="_blank" rel="noreferrer">下载</a>
                  <button class="ghost" @click="removeSourceFile(item)">删除</button>
                </div>
              </article>
            </div>
            <p v-else class="empty">还没有上传记录。</p>
          </div>
        </section>

        <section v-show="tab === 'practice'" class="panel stack practice-panel">
          <div class="section-head">
            <h2>刷题</h2>
            <div class="inline practice-toolbar">
              <select v-model="practiceFilter.level" @change="resetPractice">
                <option value="">全部等级</option>
                <option v-for="item in levels" :key="item.value" :value="item.value">{{ item.label }}</option>
              </select>
              <select v-model="practiceFilter.type" @change="resetPractice">
                <option value="">全部题型</option>
                <option v-for="item in questionTypes" :key="item.value" :value="item.value">{{ item.label }}</option>
              </select>
              <select class="source-filter" v-model="practiceFilter.source_file_id" @change="resetPractice">
                <option value="">全部文件</option>
                <option v-for="item in sourceFiles" :key="item.id" :value="item.id">{{ item.original_name }}</option>
              </select>
              <button class="ghost" @click="shuffleQuestions">随机</button>
            </div>
          </div>
          <div v-if="practiceMode === 'wrong'" class="panel notice retry-banner">
            <div>
              <strong>错题重练模式：共 {{ wrongQuestions.length }} 题</strong>
              <p class="muted">答对会自动移出错题集，全部清空即完成重练。</p>
            </div>
            <button class="ghost" @click="exitWrongRetry">退出重练</button>
          </div>
          <div class="practice-items">
            <article
              v-for="(item, index) in practiceItems"
              :key="item.question.id"
              :id="'q-' + item.question.id"
              class="question-card practice-card"
            >
              <div class="meta">
                <span>第 {{ index + 1 }} 题</span>
                <span>{{ item.question.chapter || item.question.category || '未分章节' }}</span>
                <span>{{ labelOfLevel(item.question.level) }}</span>
                <span>{{ labelOfType(item.question.question_type) }}</span>
              </div>
              <h3 class="question-stem">{{ item.question.stem }}</h3>
              <div v-if="item.question.options && item.question.options.length" class="options">
                <button
                  v-for="opt in item.question.options"
                  :key="opt.key"
                  :class="optionClassFor(item, opt)"
                  :disabled="item.submitted"
                  @click="answerOption(item, opt.key)"
                >
                  <strong>{{ opt.key }}</strong>
                  <span>{{ opt.text }}</span>
                </button>
              </div>
              <textarea
                v-else
                v-model="item.practicalText"
                placeholder="实操题请写出你的步骤或要点，提交后保存答案，可由 AI 或人工判分。"
              ></textarea>
              <div class="actions">
                <button
                  v-if="item.question.question_type === 'multiple' || item.question.question_type === 'practical'"
                  @click="submitPracticeItem(item)"
                  :disabled="item.submitted"
                >
                  {{ item.submitted ? '已提交' : '提交' }}
                </button>
                <button class="ghost" @click="toggleFavorite(item.question)">
                  {{ favoriteSet.has(item.question.id) ? '取消收藏' : '收藏' }}
                </button>
                <button class="ghost" @click="openFeedback(item.question)">题目有误</button>
              </div>
              <div v-if="item.submitted" class="result" :class="{ ok: item.isCorrect === true, bad: item.isCorrect === false }">
                <strong>{{ item.resultLabel }}</strong>
                <p v-if="item.question.question_type !== 'practical'">正确答案：{{ item.correctAnswer }}</p>
                <p>{{ item.explanation || '本题暂无解析' }}</p>
              </div>
              <div v-if="feedbackOpen === item.question.id" class="feedback-form">
                <strong>题目有误，请描述问题</strong>
                <textarea v-model.trim="feedbackMessage" placeholder="例如：答案应该是 B / 表述有误 / 选项缺字等"></textarea>
                <div class="actions">
                  <button @click="submitFeedback">提交反馈</button>
                  <button class="ghost" @click="closeFeedback">取消</button>
                </div>
              </div>
            </article>
            <p v-if="!practiceItems.length" class="empty">没有题目，先上传文件或者手动新增几题。</p>
          </div>
        </section>

        <section v-show="tab === 'exam'" class="panel grid-two">
          <div class="stack">
            <div class="section-head">
              <h2>模拟考试</h2>
              <div class="inline">
                <select v-model="examForm.level">
                  <option v-for="item in levels" :key="item.value" :value="item.value">{{ item.label }}</option>
                </select>
                <button @click="startExam">一键生成</button>
              </div>
            </div>
            <div class="exam-rule">
              <span>单选 {{ examRule.single }} 题</span>
              <span>多选 {{ examRule.multiple }} 题</span>
              <span>判断 {{ examRule.judge }} 题</span>
              <span>实操 {{ examRule.practical }} 题</span>
              <span>共 100 分</span>
              <span>{{ examRule.minutes }} 分钟</span>
              <span>{{ examRule.passScore }} 分及格</span>
            </div>
            <div class="inline mode-switch">
              <button class="ghost" :class="{ active: examForm.mode === 'answer' }" @click="examForm.mode = 'answer'">答题模式</button>
              <button class="ghost" :class="{ active: examForm.mode === 'memorize' }" @click="examForm.mode = 'memorize'">背题模式</button>
            </div>
            <p class="muted">模拟考试按 单选 → 多选 → 判断 → 实操 顺序出题；理论题每题 1 分，实操题不计入自动评分。</p>
            <div v-if="examQuestions.length" class="question-card">
              <div class="meta">
                <span>已答 {{ answeredCount }}/{{ examQuestions.length }}</span>
                <span>倒计时 {{ examCountdown }}</span>
                <span>{{ examForm.mode === 'memorize' ? '背题模式' : '答题模式' }}</span>
              </div>
              <div v-for="section in examSections" :key="section.type" class="exam-section">
                <h3 class="exam-section-title">{{ section.title }}</h3>
                <div v-for="(item, idx) in section.questions" :key="item.id" class="exam-item">
                  <h3><span class="exam-no">{{ section.startIndex + idx }}.</span> {{ item.stem }}</h3>
                  <div v-if="item.question_type !== 'practical' && item.options && item.options.length" class="options compact">
                    <button
                      v-for="opt in item.options"
                      :key="opt.key"
                      :class="{ active: (examAnswers[item.id] || []).includes(opt.key) }"
                      @click="toggleExamAnswer(item, opt.key)"
                    >
                      <strong>{{ opt.key }}</strong>
                      <span>{{ opt.text }}</span>
                    </button>
                  </div>
                  <textarea
                    v-else
                    :value="examAnswers[item.id] ? examAnswers[item.id].join(' ') : ''"
                    @input="examAnswers[item.id] = [$event.target.value]"
                    placeholder="实操题答案"
                  ></textarea>
                  <div v-if="examRevealSet.has(item.id) || examResult" class="result">
                    <strong>答案解析</strong>
                    <p v-if="item.question_type !== 'practical'">正确答案：{{ item.answer ? item.answer.join(' ') : '' }}</p>
                    <p>{{ item.explanation || '暂无解析' }}</p>
                  </div>
                  <div class="actions">
                    <button v-if="examForm.mode === 'memorize'" class="ghost" @click="toggleExamReveal(item.id)">
                      {{ examRevealSet.has(item.id) ? '隐藏答案' : '查看答案' }}
                    </button>
                  </div>
                </div>
              </div>
              <button @click="submitExam">提交试卷</button>
            </div>
            <p v-else class="empty">先组卷，再答题。</p>
          </div>

          <div class="stack">
            <h2>考试结果</h2>
            <div v-if="examResult" class="result">
              <strong>总分 {{ examResult.score }} 分，{{ examResult.passed ? '及格' : '未及格' }}</strong>
              <p>模式：{{ examResult.mode === 'memorize' ? '背题模式' : '答题模式' }}</p>
              <p>正确数 {{ examResult.correctCount }}，错误数 {{ examResult.wrongCount }}</p>
              <p>正确率 {{ examResult.correctRate }}%，及格线 {{ examRule.passScore }} 分</p>
              <p>考试时间 {{ examResult.durationText }}</p>
              <div v-if="examResult.wrongQuestions.length">
                <p v-for="item in examResult.wrongQuestions" :key="item.id">错题：{{ item.stem }}，正确答案：{{ item.correctAnswer }}</p>
              </div>
            </div>
            <p v-else class="empty">提交后会自动算分并列出错题。</p>
          </div>
        </section>

        <section v-show="tab === 'learning'" class="panel stack">
          <div class="section-head">
            <h2>学习中心</h2>
            <button class="ghost" @click="refreshAll">刷新</button>
          </div>
          <div class="learning-summary">
            <article>
              <span>今日完成</span>
              <strong>{{ learningStats.todayDone }}题</strong>
            </article>
            <article>
              <span>连续学习</span>
              <strong>{{ learningStats.streakDays }}天</strong>
            </article>
            <article>
              <span>总体正确率</span>
              <strong>{{ learningStats.correctRate }}%</strong>
            </article>
          </div>
          <div class="stack">
            <h2>章节掌握</h2>
            <article v-for="item in chapterMastery" :key="item.key" class="chapter-row">
              <div>
                <strong>{{ item.name }}</strong>
                <p class="muted">{{ labelOfLevel(item.level) }} · 已答 {{ item.done }}/{{ item.total }} · 正确率 {{ item.correctRate }}%</p>
              </div>
              <div class="progress">
                <span :style="{ width: item.progress + '%' }"></span>
              </div>
            </article>
            <p v-if="!chapterMastery.length" class="empty">还没有章节数据。</p>
          </div>
        </section>

        <section v-show="tab === 'wrong'" class="panel stack">
          <div class="section-head">
            <h2>错题集</h2>
            <div class="inline">
              <select v-model="wrongFilter.level">
                <option value="">全部等级</option>
                <option v-for="item in levels" :key="item.value" :value="item.value">{{ item.label }}</option>
              </select>
              <select v-model="wrongFilter.type">
                <option value="">全部题型</option>
                <option v-for="item in questionTypes" :key="item.value" :value="item.value">{{ item.label }}</option>
              </select>
              <button class="ghost" @click="resetWrongFilters">清空筛选</button>
            </div>
          </div>
          <div class="search-row">
            <input v-model.trim="wrongFilter.search" placeholder="搜索错题" />
            <span>共 {{ wrongQuestions.length }} 题</span>
            <button v-if="wrongQuestions.length" class="ghost" @click="startWrongRetry">全部重练</button>
          </div>
          <div v-if="wrongQuestions.length" class="list tall">
            <article v-for="item in wrongQuestions" :key="item.id" class="list-item">
              <div>
                <strong>
                  {{ item.stem }}
                  <span v-if="(wrongCounts[item.id] || 0) > 1" class="badge">错 {{ wrongCounts[item.id] }} 次</span>
                </strong>
                <p class="muted">{{ labelOfLevel(item.level) }} · {{ labelOfType(item.question_type) }}</p>
                <p class="muted">正确答案：{{ item.answer ? item.answer.join(' ') : '' }}</p>
              </div>
              <div class="actions">
                <button class="ghost" @click="loadIntoPractice(item)">练习</button>
                <button class="ghost" @click="toggleFavorite(item)">{{ favoriteSet.has(item.id) ? '已收藏' : '收藏' }}</button>
              </div>
            </article>
          </div>
          <p v-else class="empty">还没有错题记录。</p>
        </section>

        <section v-show="tab === 'admin'" class="panel stack">
          <div class="admin-grid">
            <div class="stack">
              <h2>CSV上传</h2>
              <label class="picker-card">
                <span class="picker-title">上传CSV并预览</span>
                <span class="muted">字段：question, option_a, option_b, option_c, option_d, answer, analysis, level, chapter</span>
                <span class="picker-button secondary">选择CSV</span>
                <input class="hidden-file" type="file" accept=".csv,text/csv" @change="onPickCsv" />
              </label>
              <div v-if="csvImport.rows.length" class="upload-progress">
                <strong>预览 {{ csvImport.validRows.length }}/{{ csvImport.rows.length }} 行可导入</strong>
                <p v-if="csvImport.errors.length">{{ csvImport.errors.slice(0, 5).join('；') }}</p>
                <p v-else>验证通过，可以导入。</p>
              </div>
              <div v-if="csvImport.rows.length" class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>题干</th>
                      <th>答案</th>
                      <th>等级</th>
                      <th>章节</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="(row, index) in csvImport.rows.slice(0, 20)" :key="index">
                      <td>{{ row.question }}</td>
                      <td>{{ row.answer }}</td>
                      <td>{{ row.level }}</td>
                      <td>{{ row.chapter }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <button :disabled="!csvImport.validRows.length" @click="importCsvQuestions">导入CSV</button>
            </div>

            <div class="stack">
              <h2>章节管理</h2>
              <div class="form-grid">
                <label>
                  等级
                  <select v-model="chapterEditor.level">
                    <option v-for="item in levels" :key="item.value" :value="item.value">{{ item.label }}</option>
                  </select>
                </label>
                <label>
                  章节名称
                  <input v-model.trim="chapterEditor.name" />
                </label>
                <label>
                  排序
                  <input v-model.number="chapterEditor.sort_order" type="number" />
                </label>
              </div>
              <div class="actions">
                <button @click="saveChapter">{{ chapterEditor.id ? '更新章节' : '新增章节' }}</button>
                <button class="ghost" @click="clearChapterEditor">清空</button>
              </div>
              <div class="list tall">
                <article v-for="item in chapters" :key="item.id" class="list-item">
                  <div>
                    <strong>{{ item.name }}</strong>
                    <p class="muted">{{ labelOfLevel(item.level) }}</p>
                  </div>
                  <div class="actions">
                    <button class="ghost" @click="editChapter(item)">编辑</button>
                    <button class="ghost" @click="deleteChapter(item)">删除</button>
                  </div>
                </article>
              </div>
            </div>
          </div>

          <div class="admin-grid">
          <div class="stack">
            <h2>{{ editingId ? '后台编辑题目' : '后台新增题目' }}</h2>
            <div class="form-grid">
              <label>
                等级
                <select v-model="editor.level">
                  <option v-for="item in levels" :key="item.value" :value="item.value">{{ item.label }}</option>
                </select>
              </label>
              <label>
                题型
                <select v-model="editor.question_type">
                  <option v-for="item in questionTypes" :key="item.value" :value="item.value">{{ item.label }}</option>
                </select>
              </label>
              <label>
                分类
                <input v-model="editor.category" />
              </label>
              <label>
                章节
                <input v-model="editor.chapter" />
              </label>
            </div>
            <label>
              题干
              <textarea v-model="editor.stem"></textarea>
            </label>
            <label v-if="editor.question_type !== 'practical'">
              选项，每行一个，如 `A. 选项`
              <textarea v-model="editor.optionsText" placeholder="A. 选项1"></textarea>
            </label>
            <label>
              答案
              <input v-model="editor.answerText" placeholder="A / A B / √ / ×" />
            </label>
            <label>
              解析
              <textarea v-model="editor.explanation"></textarea>
            </label>
            <div class="actions">
              <button @click="saveQuestion">{{ editingId ? '更新' : '保存' }}</button>
              <button class="ghost" @click="clearEditor">清空</button>
            </div>
          </div>

          <div class="stack">
            <h2>题目管理</h2>
            <div class="search-row">
              <input v-model.trim="manageSearch" placeholder="搜索题目" />
              <button class="ghost" @click="refreshAll">刷新</button>
            </div>
            <div class="list tall">
              <article v-for="item in managedQuestions" :key="item.id" class="list-item">
                <div>
                  <strong>{{ item.stem }}</strong>
                  <p class="muted">{{ labelOfLevel(item.level) }} · {{ labelOfType(item.question_type) }} · {{ item.chapter || '未分章节' }}</p>
                </div>
                <div class="actions">
                  <button class="ghost" @click="editQuestion(item)">编辑</button>
                  <button class="ghost" @click="deleteQuestion(item)">删除</button>
                </div>
              </article>
            </div>
          </div>
          </div>
        </section>

        <section v-show="tab === 'roster'" class="panel stack">
          <div class="section-head">
            <h2>学习看板</h2>
            <div class="inline">
              <select v-model="rosterTeamFilter">
                <option value="">全部班组</option>
                <option v-for="team in rosterTeams" :key="team" :value="team">{{ team }}</option>
              </select>
              <button class="ghost" @click="loadRoster">刷新</button>
              <button @click="exportRoster">导出 Excel</button>
            </div>
          </div>
          <p v-if="!isAdmin" class="muted">只有管理员可以查看学习看板。</p>
          <div v-else-if="rosterRows.length" class="table-wrap">
            <table class="roster-table">
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>班组</th>
                  <th>做题数</th>
                  <th>正确率</th>
                  <th>错题数</th>
                  <th>收藏</th>
                  <th>考试次数</th>
                  <th>平均分</th>
                  <th>最近考试</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="row in filteredRosterRows()" :key="row.user_id">
                  <td>{{ row.name }}</td>
                  <td><input v-model.trim="row.team" class="team-input" @change="saveTeam(row)" placeholder="未分组" /></td>
                  <td>{{ row.done }}</td>
                  <td>{{ row.correctRate }}%</td>
                  <td>{{ row.wrong }}</td>
                  <td>{{ row.favorites }}</td>
                  <td>{{ row.examCount }}</td>
                  <td>{{ row.avgScore !== null ? row.avgScore : '—' }}</td>
                  <td>{{ row.lastExam || '—' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <p v-else class="empty">暂无数据，点击「刷新」加载。</p>
        </section>

        <section v-show="tab === 'review'" class="panel stack">
          <div class="section-head">
            <h2>纠错审核</h2>
            <div class="inline">
              <select v-model="feedbackFilter" @change="loadFeedback">
                <option value="pending">待处理</option>
                <option value="fixed">已处理</option>
                <option value="ignored">已忽略</option>
                <option value="">全部</option>
              </select>
              <button class="ghost" @click="loadFeedback">刷新</button>
            </div>
          </div>
          <p v-if="!isAdmin" class="muted">只有管理员可以审核反馈。</p>
          <div v-else-if="feedbackList.length" class="list">
            <article v-for="item in feedbackList" :key="item.id" class="list-item feedback-item">
              <div>
                <strong>{{ item.stem }}</strong>
                <p class="muted">{{ item.submitter }} · {{ item.dateText }}</p>
                <p>反馈：{{ item.message }}</p>
              </div>
              <div v-if="item.status === 'pending'" class="actions">
                <button @click="markFeedback(item.id, 'fixed')">已处理</button>
                <button class="ghost" @click="markFeedback(item.id, 'ignored')">忽略</button>
              </div>
              <span v-else class="muted">{{ item.status === 'fixed' ? '状态：已处理' : '状态：已忽略' }}</span>
            </article>
          </div>
          <p v-else class="empty">没有反馈记录。</p>
        </section>

        <section v-show="tab === 'docs'" class="panel stack docs">
          <h2>部署教程</h2>
          <p>1. 在 Supabase 建一个项目。</p>
          <p>2. 在 SQL Editor 里运行 <code>supabase-schema.sql</code>。</p>
          <p>3. 到 Storage 创建或确认 bucket <code>question-files</code> 为 public。</p>
          <p>4. 把 Supabase 的 Project URL 和 anon key 填进 <code>app-config.js</code>。</p>
          <p>5. 把整个文件夹直接拖到 Netlify Drop，或者在 Cloudflare Pages 里选择 Direct Upload。</p>
          <p class="muted">这套是纯静态页面，不需要构建，也不需要 Docker。</p>
        </section>

        <nav class="mobile-nav">
          <button :class="{ active: tab === 'home' }" @click="tab = 'home'">首页</button>
          <button :class="{ active: tab === 'practice' }" @click="tab = 'practice'">刷题</button>
          <button :class="{ active: tab === 'exam' }" @click="tab = 'exam'">考试</button>
          <button :class="{ active: tab === 'wrong' }" @click="tab = 'wrong'">错题</button>
          <button :class="{ active: tab === 'profile' }" @click="tab = 'profile'">个人</button>
          <button :class="{ active: ['learning', 'upload', 'admin', 'docs', 'roster', 'review', 'manage'].includes(tab) }" @click="tab = 'manage'">管理</button>
        </nav>
      </div>
    </template>
    <div id="app"></div>
    <script type="module" src="./app.js?v=20260802-v4"></script>
  </body>
</html>
